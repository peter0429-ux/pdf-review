name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 第一阶段：静态检查（快，先跑，挡住低级错误）
  # ------------------------------------------------------------------
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 三个静态检查
        run: |
          echo "=== pbxproj 结构校验 ==="
          python scripts/check_pbxproj.py
          echo "=== Swift 类型一致性 ==="
          python scripts/check_swift_consistency.py
          echo "=== 格式标准三方一致性 ==="
          python scripts/check_format_consistency.py

  # ------------------------------------------------------------------
  # 第二阶段：macOS 上真编译（这是本仓库 CI 的核心价值：
  # Windows 开发机上无法编译 Swift，这里补上）
  # ------------------------------------------------------------------
  xcode-build:
    needs: static-checks
    # macos-14 已被 GitHub 下线（"configuration not supported"），用 macos-15
    # macos-15 自带 Xcode 16.x，可编译 deployment target iOS 17.0 的工程
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 重新生成 pbxproj 并验证无 diff
        # 磁盘上的 Swift 文件清单如果和已提交的 pbxproj 脱节，这里立刻暴露
        run: |
          python scripts/generate_pbxproj.py
          git diff --exit-code PdfReview.xcodeproj/project.pbxproj || {
            echo "::error::pbxproj 与磁盘文件清单不一致。请在本机重新运行：python scripts/generate_pbxproj.py 并提交"
            exit 1
          }

      - name: 编译（App + Widget 两个 target，真机 arm64 架构）
        run: |
          set -o pipefail
          # 用 -target 而不是 -scheme：scheme 需要 xcshareddata 里的共享
          # scheme 文件，本工程是脚本生成的，没有它。-target 直接命中 target。
          # 用 -sdk iphoneos 出真机 arm64 架构（模拟器架构 Sideloadly 重签后
          # 也装不上真机，这是上次「Unable to Install」的根因）。
          # Release 配置：真机安装用 Release 更合适（无调试开销）。
          # SYMROOT 以 build setting 形式传（-SYMROOT 不是合法命令行选项）。
          xcodebuild build \
            -project PdfReview.xcodeproj \
            -target PdfReview \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -warnings-as-errors' \
            2>&1 | tee build.log
        # 不加 xcpretty：runner 上不一定有，且它会吞掉原始错误行

      - name: 打包未签名 IPA
        # CI 没有开发者证书，产出未签名 IPA；
        # Windows 上用 Sideloadly / AltStore + 个人 Apple ID 签名后安装。
        #
        # 注意：未签名包里没有任何 entitlements——App Groups 之类的能力
        # 是 Sideloadly 重签时按它自己的 profile 注入的。所以在这里出
        # 「无 App Groups 变体」是白费功夫，两份包会几乎一致。
        run: |
          # 动态定位 .app，不硬编码 SYMROOT 的目录层级
          APP=$(find build -type d -name "PdfReview.app" | head -1)
          test -n "$APP" || { echo "::error::build 下找不到 PdfReview.app"; find build -maxdepth 4 -type d | head -30; exit 1; }
          echo "找到产物: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          # .app 里已内嵌 Widget 的 .appex（Embed Foundation Extensions 阶段完成）
          zip -q -r PdfReview-unsigned.ipa Payload
          ls -lh PdfReview-unsigned.ipa

      - name: 判定编译结果
        if: always()
        run: |
          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "编译成功"
          elif grep -q "BUILD FAILED" build.log; then
            echo "::error::xcodebuild 编译失败，错误行如下"
            grep -E "error:|warning: .*deprecated" build.log | head -60 || true
            grep -B 3 -A 10 "error:" build.log | head -120 || true
            exit 1
          else
            echo "::error::日志中既无 BUILD SUCCEEDED 也无 BUILD FAILED，视为失败，末尾 80 行："
            tail -80 build.log
            exit 1
          fi

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传未签名 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PdfReview-unsigned-ipa
          path: PdfReview-unsigned.ipa
          retention-days: 30

  # ------------------------------------------------------------------
  # 第三阶段：模拟器启动冒烟（抓「一打开就闪退」这类运行时崩溃）
  # 静态检查和编译都发现不了启动崩溃，必须真跑一次。
  # ------------------------------------------------------------------
  simulator-smoke:
    needs: static-checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 选一台可用的 iPhone 模拟器
        id: pick
        run: |
          set -euo pipefail
          python scripts/generate_pbxproj.py
          # 选设备的逻辑放在 scripts/pick_simulator.py 里：
          # YAML 块里的内联 Python 一旦有引号嵌套就会报「YAML 解析失败」，
          # 而且报错位置指向整个文件，排查成本极高。
          DEVICE=$(python scripts/pick_simulator.py)
          test -n "$DEVICE" || { echo "::error::没选出模拟器"; exit 1; }
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "选中模拟器：$DEVICE"

      - name: 编译模拟器版
        run: |
          set -o pipefail
          xcodebuild build \
            -project PdfReview.xcodeproj \
            -target PdfReview \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$(pwd)/sim" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee sim-build.log

      - name: 安装并启动，检查是否闪退
        run: |
          set -uo pipefail
          DEVICE="${{ steps.pick.outputs.device }}"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find sim -type d -name "PdfReview.app" | head -1)
          test -n "$APP" || { echo "::error::找不到 PdfReview.app"; exit 1; }

          echo "安装 $APP"
          xcrun simctl install "$DEVICE" "$APP"

          # simctl launch 成功时输出 "<bundle-id>: <pid>"，这个 PID 是判断
          # 「有没有闪退」最直接的依据：进程没了说明它自己退出了。
          echo "启动 com.pdfreview.app"
          LAUNCH=$(xcrun simctl launch "$DEVICE" com.pdfreview.app 2>&1) || true
          echo "$LAUNCH"
          PID=$(echo "$LAUNCH" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | head -1)

          if [ -z "$PID" ]; then
            echo "::error::simctl launch 没有返回 PID，启动就失败了"
            ALIVE=0
          else
            echo "PID=$PID"
            # 给启动留足时间：SwiftData 建库 + 首次维护都在这个时候
            sleep 12
            if kill -0 "$PID" 2>/dev/null; then
              echo "PID $PID 仍在运行：没有闪退"
              ALIVE=1
            else
              echo "PID $PID 已消失：疑似启动崩溃"
              ALIVE=0
            fi
          fi

          echo "=== 崩溃报告 ==="
          mkdir -p crash-logs
          cp -R ~/Library/Logs/DiagnosticReports/. crash-logs/ 2>/dev/null || true
          ls -la crash-logs 2>/dev/null | head -20 || true

          # App 自己的日志（SwiftData 建库报错、LaunchServices 拒启动都在这）
          echo "=== 最近的 App 相关系统日志 ==="
          xcrun simctl spawn "$DEVICE" log show \
            --last 3m \
            --predicate 'processImagePath CONTAINS "PdfReview" OR eventMessage CONTAINS "PdfReview" OR eventMessage CONTAINS "ModelContainer"' \
            --style compact 2>/dev/null | tail -150 || true

          if [ "$ALIVE" != "1" ]; then
            echo "::error::模拟器里 App 启动后进程消失，见日志与 crash-logs"
            exit 1
          fi

      - name: 上传崩溃日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-crash-logs
          path: |
            crash-logs/
            sim-build.log
          retention-days: 14
          if-no-files-found: ignore
